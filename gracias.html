<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación Enviada</title>
    <style>
        body {
            background-color: #e5e5e5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #fffde6;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            border: 1px solid #e0dcaf;
        }
        h2 {
            color: #2e7d32;
            margin-top: 0;
        }
        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #e67e22; /* Color anaranjado */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #d35400; /* Anaranjado más oscuro al pasar el mouse */
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>✓ Verificación enviada</h2>
        <p>En 24 horas tendrá retorno en su correo del estado de la verificación.</p>
        <!-- Botón actualizado con el color y texto requerido -->
        <a href="index.html" class="btn">Cerrar verificación</a>
    </div>

</body>
</html>
